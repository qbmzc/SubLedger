plugins {
    id 'com.android.application' version '8.7.3'
}

// CI signs every build with one fixed key (stored as repository secrets), so new builds install
// over old ones. Local builds without these variables use the usual Android debug key.
def ciKeystore = System.getenv('SIGNING_KEYSTORE')

android {
    namespace 'com.subledger.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.subledger.mobile'
        minSdk 26
        targetSdk 34
        // 100 + the CI run number: the repository moved to qbmzc/SubLedger, whose run numbers
        // restarted at 1, while builds from the old repository reached 11.
        versionCode(100 + ((System.getenv('GITHUB_RUN_NUMBER') ?: '0') as int))
        versionName '0.5.1'
    }

    signingConfigs {
        if (ciKeystore) {
            ci {
                storeFile file(ciKeystore)
                storePassword System.getenv('SIGNING_PASSWORD')
                keyAlias System.getenv('SIGNING_ALIAS')
                keyPassword System.getenv('SIGNING_PASSWORD')
            }
        }
    }

    buildTypes {
        // CI ships the release build: unlike debug builds it is not debuggable, so `adb run-as`
        // cannot read the ledger or attachments. Without the CI key (local builds) it is signed
        // with the debug key, so it still installs.
        release {
            signingConfig ciKeystore ? signingConfigs.ci : signingConfigs.debug
        }
    }

    lint {
        // Also as text, which CI prints to its log.
        textReport = true
        // Not applicable by design (see CLAUDE.md): no AndroidX, UI text is written in code
        // (Simplified Chinese only), and views are only ever built in code.
        disable.addAll(['ExifInterface', 'SetTextI18n', 'ViewConstructor'])
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
