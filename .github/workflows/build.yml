name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags, for the release notes.
          fetch-depth: 0

      - name: Check tag matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # The in-app updater compares the release tag with the installed versionName.
          name=$(sed -n "s/^ *versionName '\(.*\)'.*/\1/p" app/build.gradle)
          if [ "v$name" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match versionName '$name' in app/build.gradle"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/subledger.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/subledger.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          SIGNING_ALIAS: ${{ secrets.SIGNING_ALIAS }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "SubscriptionLedger-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SubscriptionLedger-${{ github.run_number }}
          path: SubscriptionLedger-${{ github.run_number }}.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes list the commit subjects since the previous tag; the app shows them as
          # the update's changes.
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          git log --no-merges --format='- %s' ${previous:+"$previous.."}"$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" "SubscriptionLedger-${{ github.run_number }}.apk" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
